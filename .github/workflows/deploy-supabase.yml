name: Publicar backend no Supabase

# O backend da plataforma é uma Edge Function do Supabase (supabase/functions/api).
# A Vercel publica apenas o frontend estático e não participa mais de nenhuma
# requisição de API.
#
# Este workflow existe para que publicar o backend não dependa de alguém rodar um
# comando na própria máquina. Enquanto dependia, a pergunta "o que está no ar é o
# último commit?" não tinha resposta — e responder a essa pergunta custou várias
# rodadas de diagnóstico às cegas.
#
# Pré-requisito, feito uma única vez:
#   Settings → Secrets and variables → Actions → New repository secret
#   Nome:  SUPABASE_ACCESS_TOKEN
#   Valor: um token de https://supabase.com/dashboard/account/tokens

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  publicar:
    name: supabase functions deploy api
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJETO: cghlfhndoqohmrrvppjj

    steps:
      - uses: actions/checkout@v4

      - name: Conferir se o segredo de acesso está configurado
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN no repositório."
            echo "Crie um token em https://supabase.com/dashboard/account/tokens e"
            echo "cadastre-o em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Carimba qual commit está no ar. É o que /api/health devolve, e é a
      # resposta para a pergunta que ficou semanas sem resposta: "o que está
      # publicado é mesmo o último merge?".
      - name: Carimbar a versão
        run: supabase secrets set COMMIT_SHA="$GITHUB_SHA" --project-ref "$PROJETO"

      - name: Publicar a função de API
        run: supabase functions deploy api --project-ref "$PROJETO"

      # Uma publicação que "deu certo" mas cuja função não responde é o modo de
      # falha que já custou caro aqui. O health check confirma que o que subiu
      # executa de verdade, e falha o workflow se não executar.
      - name: Conferir que a função responde
        run: |
          URL="https://$PROJETO.supabase.co/functions/v1/api/health"
          for tentativa in 1 2 3 4 5; do
            CODIGO=$(curl -s -o /tmp/saude.json -w "%{http_code}" "$URL" || true)
            if [ "$CODIGO" = "200" ]; then
              echo "Backend no ar:"; cat /tmp/saude.json; exit 0
            fi
            echo "Tentativa $tentativa: HTTP $CODIGO"; sleep 5
          done
          echo "::error::A função foi publicada, mas /api/health não respondeu 200."
          cat /tmp/saude.json || true
          exit 1
