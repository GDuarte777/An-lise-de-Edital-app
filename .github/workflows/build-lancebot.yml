name: Build LanceBot Desktop

# Gera o instalador do Windows e publica como Release, para que o operador possa
# baixar um .exe em vez de compilar o projeto na própria máquina.
#
# Dispara de duas formas:
#  - manualmente, pela aba Actions (botão "Run workflow");
#  - ao publicar uma tag no formato lancebot-v* (ex.: lancebot-v0.1.0).

on:
  workflow_dispatch:
  push:
    tags:
      - "lancebot-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run lint

      - name: Rodar testes da guarda de margem
        run: npm test

      - name: Compilar aplicativo
        run: npm run build

      # Sobe o aplicativo de verdade e confere que a interface passa da tela inicial.
      # Uma versão que abria e ficava presa em "Carregando…" já foi publicada por
      # faltar exatamente esta checagem: tipos e testes de unidade passavam.
      - name: Verificar que a interface abre
        run: npm run test:ui

      # O robô só dá lance se o agente achar a linha do item, vencer a máscara de
      # moeda e reconhecer o desfecho. Uma versão que não fazia nada disso já foi
      # publicada porque tipos, testes de unidade e smoke da interface passavam.
      - name: Verificar que o robô consegue dar lance
        run: npm run test:sala

      # O operador logou, o portal abriu janela nova, e o aplicativo ficou vigiando a
      # janela errada dizendo "sem sessão". Este teste reproduz esse fluxo.
      - name: Verificar que o login é reconhecido na janela certa
        run: npm run test:login

      # O login do gov.br cai em poucos minutos. Este teste sobe um portal falso que
      # expira sozinho e prova que o guardião atravessa várias expirações — é a razão de
      # o robô ser aplicativo instalado, então não pode ser publicado quebrado.
      - name: Verificar que a sessão do gov.br não expira
        run: npm run test:sessao

      # A extensão é o que de fato dá lance no portal (o token de hCaptcha só existe
      # dentro da página). O painel do operador e a guarda de margem são checados aqui
      # contra uma réplica da tela real antes de qualquer publicação.
      - name: Verificar o painel e o robô da extensão
        run: npm run test:extensao

      - name: Gerar instalador
        run: npx electron-builder --win --publish never

      # A extensão vai empacotada na mesma Release, para instalar sem clonar o projeto.
      - name: Empacotar extensão
        working-directory: .
        shell: pwsh
        run: Compress-Archive -Path extensao-lancebot/* -DestinationPath HORASIS-LanceBot-Extensao.zip -Force

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: lancebot-windows
          path: desktop/release/*.exe
          if-no-files-found: error

      # Publica sempre numa Release de tag fixa, para que o botão de download do painel
      # aponte a uma URL estável (releases/latest/download/HORASIS-LanceBot-Setup.exe)
      # que dispara o download direto, sem passar por tela intermediária.
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lancebot-latest
          name: HORASIS LanceBot — instalador Windows
          make_latest: true
          files: |
            desktop/release/HORASIS-LanceBot-Setup.exe
            HORASIS-LanceBot-Extensao.zip
          body: |
            ## Aplicativo Windows — é ele que dá o lance

            Download direto:
            https://github.com/${{ github.repository }}/releases/latest/download/HORASIS-LanceBot-Setup.exe

            Entre com sua conta HORASIS, clique em "Entrar no gov.br" e faça o login
            na janela oficial — ela se fecha sozinha quando o login é reconhecido.

            Em seguida ligue **"Manter a sessão viva"**. A sessão do gov.br cai em
            poucos minutos quando ninguém mexe na página — é por isso que no navegador
            você precisa atualizar o tempo todo. O aplicativo mantém a sessão de pé
            sozinho, numa janela oculta, sem tocar na sala onde o robô está operando.
            É o que permite deixá-lo ligado e sair de perto.

            Abra a sala da disputa pelo aplicativo, escolha o item, informe o piso e o
            decremento. O robô nunca oferta abaixo do piso, confere o valor no campo
            antes de clicar, e para sozinho se o portal não confirmar o envio ou se a
            leitura da tela ficar velha.

            ## Extensão para o navegador (opcional)

            Download:
            https://github.com/${{ github.repository }}/releases/latest/download/HORASIS-LanceBot-Extensao.zip

            Mesmo motor de leitura do aplicativo, para quem preferir operar direto no
            Chrome. Descompacte numa pasta fixa, abra `chrome://extensions`, ligue o
            "Modo do desenvolvedor" e clique em "Carregar sem compactação".

            Atenção: aqui a sessão do gov.br NÃO é mantida viva — numa aba do navegador
            não há como. Se a sessão cair, o robô para. Para deixar ligado sem
            acompanhar, use o aplicativo.

            Build: ${{ github.sha }}
