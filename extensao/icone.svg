<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20355F"/><stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6CE97"/><stop offset="1" stop-color="#B98E42"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#fundo)"/>
  <rect x="7" y="7" width="498" height="498" rx="110" fill="none"
        stroke="#C09A52" stroke-opacity="0.30" stroke-width="8"/>

  <!-- Anel aberto embaixo: o robô acompanha a disputa, e a abertura é por
       onde o lance desce até o piso. -->
  <circle cx="256" cy="232" r="134" fill="none" stroke="url(#ouro)" stroke-width="36"
          stroke-linecap="round" stroke-dasharray="615 227" transform="rotate(115 256 232)"/>

  <!-- A seta é o lance baixando a cada rodada. -->
  <path d="M256 150 V 286" fill="none" stroke="#F4EAD5" stroke-width="34" stroke-linecap="round"/>
  <path d="M202 240 L256 296 L310 240" fill="none" stroke="#F4EAD5" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- O traço é o piso de margem: onde o robô para. -->
  <rect x="146" y="406" width="220" height="34" rx="17" fill="url(#ouro)"/>
</svg>
